services:
  server:
    build:
      dockerfile: server.dockerfile
      context: .
    networks:
      - app-network

  caddy:
    image: serfriz/caddy-cloudflare:latest

    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    env_file:
      - .env

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      # Issued certificates live in /data. Without a volume they are lost on
      # every container recreation, which re-runs the ACME DNS challenge and
      # burns Let's Encrypt duplicate-certificate rate limits.
      - caddy-data:/data
      - caddy-config:/config

    networks:
      - app-network

volumes:
  caddy-data:
  caddy-config:

networks:
  app-network:
    driver: bridge
